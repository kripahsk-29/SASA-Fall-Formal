<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pastels & Pearls ~ SASA 2026 Formal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f8f5f0;
    font-family: 'DM Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #3a3a3a;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 2.5rem 3rem 0;
  }

  @media (max-width: 640px) {
    header { padding: 2rem 1.5rem 0; flex-direction: column; gap: 1.5rem; }
  }

  .site-title {
    font-weight: 300;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    color: #5a4a50;
  }

  nav {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.15rem;
    font-size: 0.82rem;
    font-weight: 400;
    color: #888;
  }

  nav span.active { color: #3a3a3a; }
  nav span.active::before { content: '• '; font-size: 0.6rem; vertical-align: middle; }

  .size-toggle {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    padding: 3rem 0 2rem;
    font-size: 0.8rem;
    font-weight: 500;
  }

  .size-toggle span {
    cursor: pointer;
    color: #aaa;
    transition: color 0.2s;
    user-select: none;
  }

  .size-toggle span:hover { color: #555; }

  .size-toggle span.active {
    color: #3a3a3a;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .grid {
    max-width: 1500px;
    margin: 0 auto;
    padding: 0 2.5rem 4rem;
    display: grid;
    gap: 8px;
  }

  @media (max-width: 640px) { .grid { padding: 0 1rem 4rem; } }

  .grid.size-s { grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .grid.size-m { grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .grid.size-l { grid-template-columns: repeat(3, 1fr); gap: 12px; }

  @media (max-width: 1000px) {
    .grid.size-s { grid-template-columns: repeat(5, 1fr); }
    .grid.size-m { grid-template-columns: repeat(3, 1fr); }
    .grid.size-l { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 640px) {
    .grid.size-s { grid-template-columns: repeat(3, 1fr); }
    .grid.size-m { grid-template-columns: repeat(2, 1fr); }
    .grid.size-l { grid-template-columns: 1fr; }
  }

  .grid img {
    display: block;
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    cursor: pointer;
    opacity: 0;
    transform: scale(0.98);
    transition: opacity 0.4s ease, transform 0.4s ease, filter 0.3s ease;
  }

  .grid img.show { opacity: 1; transform: scale(1); }
  .grid img:hover { filter: brightness(1.05); }

  .lb {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(248,245,240,0.95);
    backdrop-filter: blur(20px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
    cursor: pointer;
  }

  .lb.on { opacity: 1; pointer-events: auto; }

  .lb img {
    max-width: 85vw; max-height: 88vh;
    object-fit: contain;
    transform: scale(0.96);
    transition: transform 0.3s;
  }

  .lb.on img { transform: scale(1); }

  .lb-close {
    position: absolute;
    top: 2rem; right: 2.5rem;
    font-size: 1.2rem;
    color: #888;
    cursor: pointer;
    background: none; border: none;
    font-family: inherit;
  }

  .lb-close:hover { color: #3a3a3a; }

  footer {
    text-align: center;
    padding: 0 2rem 3rem;
    font-weight: 300;
    font-size: 0.75rem;
    color: #c0b5b8;
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>

<header>
  <div class="site-title">pastels & pearls</div>
  <nav>
    <span>mood</span>
    <span class="active">inspiration</span>
    <span>details</span>
  </nav>
</header>

<div class="size-toggle" id="size-toggle">
  <span data-size="s">S</span>
  <span data-size="m" class="active">M</span>
  <span data-size="l">L</span>
</div>

<div class="grid size-m" id="grid"></div>

<footer>SASA 2026</footer>

<div class="lb" id="lb">
  <button class="lb-close">✕</button>
  <img id="lb-img" src="" alt="">
</div>

<!-- images.js is auto-generated by build.sh -->
<script src="images.js"></script>

<script>
  const grid = document.getElementById('grid');
  const lb = document.getElementById('lb');
  const lbImg = document.getElementById('lb-img');

  // render all images from the imageFiles array (loaded from images.js)
  if (typeof imageFiles !== 'undefined') {
    imageFiles.forEach((name, i) => {
      const img = document.createElement('img');
      img.src = 'images/' + name;
      img.alt = '';
      img.loading = 'lazy';

      img.onload = () => setTimeout(() => img.classList.add('show'), i * 30);
      img.onerror = () => img.remove();

      grid.appendChild(img);
    });
  }

  // size toggle
  document.getElementById('size-toggle').addEventListener('click', e => {
    if (!e.target.dataset.size) return;
    document.querySelectorAll('#size-toggle span').forEach(s => s.classList.remove('active'));
    e.target.classList.add('active');
    grid.className = 'grid size-' + e.target.dataset.size;
  });

  // lightbox
  grid.addEventListener('click', e => {
    if (e.target.tagName === 'IMG') {
      lbImg.src = e.target.src;
      lb.classList.add('on');
    }
  });

  lb.addEventListener('click', () => lb.classList.remove('on'));

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') lb.classList.remove('on');
    if (lb.classList.contains('on')) {
      const srcs = [...grid.querySelectorAll('img')].map(i => i.src);
      const cur = srcs.indexOf(lbImg.src);
      if (e.key === 'ArrowRight' && cur < srcs.length - 1) lbImg.src = srcs[cur + 1];
      if (e.key === 'ArrowLeft' && cur > 0) lbImg.src = srcs[cur - 1];
    }
  });
</script>

</body>
</html>
