<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pastels & Pearls ~ SASA 2026 Formal</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #faf8f5;
    font-family: 'Cormorant Garamond', serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    text-align: center;
    padding: 4rem 2rem 2.5rem;
  }

  header h1 {
    font-weight: 300;
    font-size: clamp(1.6rem, 4vw, 2.8rem);
    letter-spacing: 0.12em;
    color: #6b4f5a;
  }

  header .line {
    width: 40px;
    height: 1px;
    background: #c9a96e;
    margin: 1rem auto 0;
  }

  .board {
    max-width: 1400px;
    margin: 0 auto;
    padding: 1rem 12px 6rem;
    columns: 4;
    column-gap: 10px;
  }

  @media (max-width: 1000px) { .board { columns: 3; } }
  @media (max-width: 640px)  { .board { columns: 2; column-gap: 8px; } }

  .board img {
    display: block;
    width: 100%;
    height: auto;
    margin-bottom: 10px;
    border-radius: 3px;
    cursor: pointer;
    opacity: 0;
    transform: translateY(10px);
    transition: filter 0.3s ease, opacity 0.5s ease, transform 0.5s ease;
    filter: brightness(1.01) saturate(0.95);
  }

  .board img.show {
    opacity: 1;
    transform: translateY(0);
  }

  .board img:hover {
    filter: brightness(1.06) saturate(1.05);
  }

  .lb {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(30,25,27,0.88);
    backdrop-filter: blur(16px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
    cursor: pointer;
  }
  .lb.on { opacity: 1; pointer-events: auto; }
  .lb img {
    max-width: 88vw; max-height: 88vh;
    object-fit: contain; border-radius: 3px;
    transform: scale(0.95); transition: transform 0.3s;
  }
  .lb.on img { transform: scale(1); }

  footer {
    text-align: center;
    padding: 0 2rem 4rem;
    font-weight: 300;
    font-style: italic;
    font-size: 0.85rem;
    color: #b09a9e;
    letter-spacing: 0.08em;
  }
</style>
</head>
<body>

<header>
  <h1>Pastels &amp; Pearls — SASA Formal</h1>
  <div class="line"></div>
</header>

<div class="board" id="board">

  <img src="images/dress by Aleen Sabbagh.jpeg" alt="">
  <img src="images/From the Wed of J&amp;J__#UnspokenNarrative #RetmagKevin__#weddingjournalism #thewed.jpeg" alt="">

</div>

<footer>2026</footer>

<div class="lb" id="lb" onclick="this.classList.remove('on')">
  <img id="lb-img" src="" alt="">
</div>

<script>
  // fade in images as they load, remove broken ones
  document.querySelectorAll('.board img').forEach((img, i) => {
    if (img.complete && img.naturalHeight > 0) {
      setTimeout(() => img.classList.add('show'), i * 40);
    } else {
      img.onload = () => setTimeout(() => img.classList.add('show'), i * 40);
      img.onerror = () => img.remove();
    }
  });

  // lightbox
  document.getElementById('board').addEventListener('click', e => {
    if (e.target.tagName === 'IMG') {
      document.getElementById('lb-img').src = e.target.src;
      document.getElementById('lb').classList.add('on');
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('lb').classList.remove('on');
  });
</script>

</body>
</html>
